services:
  9router:
    image: ghcr.io/shinzzyak/vansrouter:latest
    container_name: 9router
    restart: always
    ports:
      - "20127:20127"
    volumes:
      - /root/.openclaw/workspace/.vansroute:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20127"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
