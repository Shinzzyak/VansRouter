name: Deploy to VPS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
  DEPLOY_PATH: /root/.openclaw/workspace/VansRouter
  SERVICE_NAME: vansrouter

jobs:
  build:
    name: Build Next.js Standalone
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build

      - name: Verify standalone output
        run: |
          test -d .next/standalone
          test -f .next/standalone/server.js

      - name: Create deploy artifact
        run: |
          tar -czf standalone.tar.gz -C .next/standalone .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone
          path: standalone.tar.gz
          retention-days: 1

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: standalone
          path: .

      - name: Deploy to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          source: "standalone.tar.gz"
          target: ${{ env.DEPLOY_PATH }}
          strip_components: 0

      - name: Restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          script: |
            cd ${{ env.DEPLOY_PATH }}
            rm -rf .next/standalone
            mkdir -p .next/standalone
            tar -xzf standalone.tar.gz -C .next/standalone
            rm standalone.tar.gz
            systemctl restart ${{ env.SERVICE_NAME }}
            echo "Deployment complete"
