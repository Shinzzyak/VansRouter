name: Build + Deploy to VPS (PM2)

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag to build"
        required: false
        default: "main"

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
  DEPLOY_PATH: /home/ubuntu/VansRouter
  PM2_NAME: 9router
  PORT: "20128"

jobs:
  build:
    name: Build standalone artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Copy static assets into standalone
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          # Bundle the root launcher (server.js) into the standalone tarball as
          # launcher.js. The standalone dir already has its own server.js (the
          # Next server), so rename ours to avoid clobbering it. The deploy step
          # copies launcher.js -> $DEPLOY/server.js so the .env loader fix ships.
          cp server.js .next/standalone/launcher.js

      - name: Create deployment tarball
        run: |
          cd .next/standalone
          tar -czf ../../vansrouter-deploy.tar.gz .
          cd ../..
          ls -lh vansrouter-deploy.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vansrouter-deploy
          path: vansrouter-deploy.tar.gz
          retention-days: 3

  deploy:
    name: Deploy to VPS + restart PM2
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vansrouter-deploy
          path: .

      - name: Upload to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          source: vansrouter-deploy.tar.gz
          target: /home/ubuntu/

      - name: Deploy + restart PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          script: |
            set -e
            DEPLOY="${{ env.DEPLOY_PATH }}"
            PM2_NAME="${{ env.PM2_NAME }}"
            TARBALL="/home/ubuntu/vansrouter-deploy.tar.gz"

            echo "=== Extracting build to ${DEPLOY}/.next/standalone ==="
            mkdir -p "${DEPLOY}/.next/standalone"
            # Backup current standalone
            if [ -d "${DEPLOY}/.next/standalone_old" ]; then
              rm -rf "${DEPLOY}/.next/standalone_old"
            fi
            if [ -d "${DEPLOY}/.next/standalone" ]; then
              mv "${DEPLOY}/.next/standalone" "${DEPLOY}/.next/standalone_old"
            fi
            mkdir -p "${DEPLOY}/.next/standalone"
            tar -xzf "${TARBALL}" -C "${DEPLOY}/.next/standalone"

            # Place the bundled launcher (with .env auto-loader) at the deploy
            # root, replacing the old server.js that did NOT load .env. Without
            # this, INITIAL_PASSWORD/JWT_SECRET from .env are never picked up.
            if [ -f "${DEPLOY}/.next/standalone/launcher.js" ]; then
              cp "${DEPLOY}/.next/standalone/launcher.js" "${DEPLOY}/server.js"
              echo "=== launcher.js -> ${DEPLOY}/server.js (env loader shipped) ==="
            fi

            # Preserve .env (it lives at project root, not in standalone)
            echo "=== .env exists? ==="
            ls -la "${DEPLOY}/.env" 2>/dev/null || echo "WARNING: .env not found"

            # --- DATA SAFETY -------------------------------------------------
            # The SQLite DB (custom providers, settings, keys, usage) lives in
            # $DATA_DIR (default ~/.9router, or DATA_DIR from .env), which is
            # OUTSIDE .next/standalone and therefore untouched by the tarball
            # extraction above. Take an explicit pre-deploy backup anyway so a
            # bad restart never loses data. Never rm -rf the data dir.
            DATA_DIR_VAL="$(grep -E '^DATA_DIR=' "${DEPLOY}/.env" 2>/dev/null | tail -1 | cut -d= -f2- | sed -E 's/^["'\''"]|["'\''"]$//g')"
            DATA_DIR_VAL="${DATA_DIR_VAL:-$HOME/.9router}"
            if [ -d "${DATA_DIR_VAL}" ]; then
              BACKUP_DIR="/home/ubuntu/vansrouter-data-backup-$(date +%Y%m%d-%H%M%S)"
              mkdir -p "${BACKUP_DIR}"
              cp -a "${DATA_DIR_VAL}/." "${BACKUP_DIR}/" 2>/dev/null \
                && echo "=== DB backed up: ${BACKUP_DIR} ===" \
                || echo "WARNING: DB backup failed (continuing)"
              # Keep only the 3 most recent backups
              ls -dt /home/ubuntu/vansrouter-data-backup-* 2>/dev/null | tail -n +4 | xargs -r rm -rf
            else
              echo "=== No DB dir at ${DATA_DIR_VAL} yet (first run) ==="
            fi

            echo "=== Restarting PM2 process: ${PM2_NAME} ==="
            export PORT="${PORT:-20128}"
            pm2 restart "${PM2_NAME}" --update-env 2>/dev/null || pm2 start "${DEPLOY}/server.js" --name "${PM2_NAME}" --env production
            pm2 save

            echo "=== Health check (PORT=${PORT}) ==="
            sleep 3
            for i in 1 2 3 4 5 6 7 8; do
              if curl -fsS "http://localhost:${PORT}/masuk" > /dev/null 2>&1; then
                echo "✅ VansRouter running on :${PORT}"
                break
              fi
              echo "Attempt $i: not ready yet..."
              sleep 3
            done

            # Final verify
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:${PORT}/masuk")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Deploy successful (HTTP $STATUS)"
              # Verify the configured password actually authenticates (not just
              # the page rendering). Read INITIAL_PASSWORD from the VPS .env
              # (the same source the launcher loads), not the CI runner env.
              # Note: from schema v4 the effective password may live in the
              # SQLite DB (set via dashboard) rather than INITIAL_PASSWORD.
              # If INITIAL_PASSWORD is absent/unset, skip the auth probe —
              # the health check (HTTP 200 on /masuk) already proves the
              # server is serving; a DB-backed password is out of CI's scope.
              DEPLOY_PW="$(grep -E '^INITIAL_PASSWORD=' "${DEPLOY}/.env" 2>/dev/null | tail -1 | cut -d= -f2- | xargs echo)"
              DEPLOY_PW="${DEPLOY_PW:-}"
              if [ -n "$DEPLOY_PW" ]; then
                LOGIN_BODY=$(curl -s --max-time 10 -X POST "http://localhost:${PORT}/api/auth/login" \
                  -H "Content-Type: application/json" \
                  -d "{\"password\":\"${DEPLOY_PW}\"}")
                if echo "$LOGIN_BODY" | grep -q '"success":true'; then
                  echo "✅ Auth check passed (configured password accepted)"
                else
                  echo "❌ Auth check FAILED: $LOGIN_BODY"
                  echo "=== pm2 describe ==="
                  pm2 describe "${PM2_NAME}" 2>&1 | head -30
                  echo "=== pm2 error log (last 40) ==="
                  pm2 logs "${PM2_NAME}" --lines 40 --nostream --err 2>&1
                  exit 1
                fi
              else
                echo "ℹ️ INITIAL_PASSWORD unset in .env — skipping auth probe (DB-backed password out of CI scope)"
              fi
              rm -f "${TARBALL}"
            else
              echo "❌ Health check failed (HTTP $STATUS)"
              echo "=== pm2 describe ==="
              pm2 describe "${PM2_NAME}" 2>&1 | head -30
              echo "=== pm2 error log (last 40) ==="
              pm2 logs "${PM2_NAME}" --lines 40 --nostream --err 2>&1
              exit 1
            fi
