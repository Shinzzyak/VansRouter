name: Build + Deploy to VPS (PM2)

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag to build"
        required: false
        default: "main"

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
  DEPLOY_PATH: /home/ubuntu/VansRouter
  PM2_NAME: 9router
  PORT: "20128"

jobs:
  build:
    name: Build standalone artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests (smoke gate — engine absent)
        run: pnpm test tests/unit/engine-not-in-repo.test.js tests/unit/engine-fail-open.test.js
        env:
          NODE_ENV: test

      # --- PRIVATE ENGINE -------------------------------------------------
      # The capability layer (godmode framing, bypass engine, persona reassert,
      # potato mechanics, instruction plan, response integrity) is NOT in this
      # repository — this repo ships generated shims only. It is compiled HERE,
      # in CI, from the private source repo. Nothing is ever built on the VPS:
      # the tarball below carries the bundle, and the VPS only unpacks it.
      #
      # The smoke gate above deliberately runs with the bundle ABSENT — that is
      # the Zero Break Guarantee (engine missing => plain proxy, no crash). The
      # behavior tests below then run WITH the bundle, so both paths are proven
      # on every build.
      - name: Fetch private engine sources
        uses: actions/checkout@v4
        with:
          repository: Shinzzyak/VansRouter-engine
          token: ${{ secrets.ENGINE_REPO_TOKEN }}
          path: .engine

      - name: Build private engine bundle
        run: |
          set -e
          mkdir -p data/engine/src
          cp .engine/src/*.js data/engine/src/
          node scripts/engine-bundle.mjs
          ls -l data/engine/engine.cjs
          # Guard: engine-bundle.mjs hydrates open-sse/rtk with the real sources
          # to resolve their relative imports, then re-shims. If it dies in
          # between, real source would reach the build and ship in the artifact.
          # The module list is read from the bundler so it can never drift from
          # the list that was actually bundled.
          mods=$(node -e 'const s=require("fs").readFileSync("scripts/engine-bundle.mjs","utf8");const m=s.match(/const ENGINE_MODULES = \[([\s\S]*?)\];/)[1];console.log([...m.matchAll(/"([^"]+)"/g)].map(x=>x[1]).join(" "))')
          echo "engine modules: $mods"
          for m in $mods; do
            grep -q "GENERATED SHIM" "open-sse/rtk/${m}.js" \
              || { echo "❌ open-sse/rtk/${m}.js is NOT a shim — real engine source would ship" >&2; exit 1; }
          done
          echo "✅ open-sse/rtk is shimmed"

      - name: Engine gates (bundle present)
        run: >-
          pnpm test
          tests/unit/godmode-injector.test.js
          tests/unit/bypass-engine-gate.test.js
          tests/unit/post-merge-verification.test.js
          tests/unit/engine-not-in-repo.test.js
          tests/unit/engine-fail-open.test.js
          tests/unit/model-capabilities.test.js
          tests/unit/gemini-guardrail-recovery.test.js
          tests/unit/reasoning-state.test.js
          tests/unit/refusal-drift.test.js
          tests/unit/stream-integrity.test.js
          tests/unit/voice-cadence.test.js
          tests/unit/thinking-gate.test.js
          tests/unit/instruction-plan.test.js
          tests/unit/engine-source-parity.test.js
          tests/unit/engine-escalation-wiring.test.js
          tests/unit/engine-stream-ledger.test.js
          tests/unit/engine-shim-selfmeasuring.test.js
          tests/unit/eng-modelImmunityHints.test.js
          tests/unit/eng-routeGuardMemory.test.js
        env:
          NODE_ENV: test
          VR_ENGINE_BUNDLE: ${{ github.workspace }}/data/engine/engine.cjs

      - name: Build
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Copy static assets into standalone
        run: |
          cp -r public/. .next/standalone/public
          cp -r .next/static/. .next/standalone/.next/static/
          # Next 16 writes server manifests (middleware-manifest.json, etc.)
          # to .next/server/ — but standalone tracing does NOT include them by
          # default. Copy the whole .next/server dir into the standalone so the
          # prod server can resolve middleware-manifest.json at boot.
          mkdir -p .next/standalone/.next/server
          cp -r .next/server/. .next/standalone/.next/server/
          # open-sse/ is imported via bare specifier ("open-sse/...") which
          # Next.js does NOT trace into the standalone output. Without it the
          # production server cannot resolve providers/executors (FreeBuff,
          # qoder, cline, godmode injectors, ...). Copy the whole tree into
          # the standalone root so `require("open-sse/...")` resolves from
          # the standalone cwd (same layout as the repo root).
          cp -r open-sse .next/standalone/open-sse
          # Node bare-specifier resolution only searches node_modules/, so
          # copy open-sse + the @/lib alias into the standalone node_modules.
          # (open-sse internally imports "@/lib/usageDb.js", undici, uuid,
          # node-machine-id — all missing from the standalone trace.)
          # NOTE: real copies, not symlinks — tar does not preserve symlink
          # targets reliably in this artifact.
          mkdir -p .next/standalone/node_modules/@
          cp -r open-sse .next/standalone/node_modules/open-sse
          # @/* = ./src/* (jsconfig) — mirror the whole src tree so @/lib,
          # @/sse, @/models, @/shared etc all resolve at runtime.
          cp -r src/. .next/standalone/node_modules/@/
          # open-sse/services/tokenRefresh/providers.js imports
          # "../../../src/lib/..." which, from node_modules/open-sse/services/
          # tokenRefresh/, resolves to node_modules/src/lib/... — mirror src.
          cp -r src .next/standalone/node_modules/src
          # open-sse/shared/clineAuth.js imports "../../package.json" which,
          # from node_modules/open-sse/shared/, resolves to node_modules/package.json.
          cp package.json .next/standalone/node_modules/package.json
          # -L: pnpm keeps these as symlinks into .pnpm/; dereference so the
          # tarball carries real files (symlinks break across tar extract).
          cp -rL node_modules/undici .next/standalone/node_modules/undici
          cp -rL node_modules/uuid .next/standalone/node_modules/uuid
          cp -rL node_modules/node-machine-id .next/standalone/node_modules/node-machine-id
          # sql.js wasm — Next.js does not trace the .wasm asset into standalone;
          # without it the sql.js fallback SQLite driver aborts at runtime
          # ("No SQLite driver available" when better-sqlite3 fails). Copy the
          # dist dir (js + wasm) into BOTH the flat node_modules/sql.js and the
          # .pnpm store path the runtime may resolve (mkdir -p first — the
          # target parent may not exist in the standalone trace).
          mkdir -p .next/standalone/node_modules/sql.js/dist
          cp -rL node_modules/sql.js/dist/. .next/standalone/node_modules/sql.js/dist/
          mkdir -p .next/standalone/node_modules/.pnpm/sql.js@1.14.1/node_modules/sql.js/dist
          cp -rL node_modules/sql.js/dist/. .next/standalone/node_modules/.pnpm/sql.js@1.14.1/node_modules/sql.js/dist/
          # Bundle the root launcher (server.js) into the standalone tarball as
          # launcher.js. The standalone dir already has its own server.js (the
          # Next server), so rename ours to avoid clobbering it. The deploy step
          # copies launcher.js -> $DEPLOY/server.js so the .env loader fix ships.
          cp server.js .next/standalone/launcher.js
          # Bundle runtime Python scripts (YYDS temp-mail client) into standalone
          cp -r scripts .next/standalone/scripts

      # Ship the CI-built engine bundle inside the artifact. This is the only
      # path the bundle takes to production — there is no hand-placed copy on
      # the VPS and no build step there. engineLoader.js walks up from the live
      # cwd, so <standalone>/data/engine/engine.cjs is the first candidate it
      # tries when the server runs from .next/standalone.
      - name: Ship engine bundle into the standalone artifact
        run: |
          set -e
          mkdir -p .next/standalone/data/engine
          cp data/engine/engine.cjs .next/standalone/data/engine/engine.cjs
          # Reachability, not presence: run the probe from the exact layout the
          # standalone server boots in. A bundle that cannot be found from there
          # is the failure this whole step exists to catch.
          cd .next/standalone && node open-sse/rtk/engineProbe.mjs

      - name: Create deployment tarball
        run: |
          cd .next/standalone
          tar -czf ../../vansrouter-deploy.tar.gz .
          cd ../..
          ls -lh vansrouter-deploy.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vansrouter-deploy
          path: vansrouter-deploy.tar.gz
          retention-days: 3

  deploy:
    name: Deploy to VPS + restart PM2
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vansrouter-deploy
          path: .

      - name: Upload to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          source: vansrouter-deploy.tar.gz
          target: ${{ env.DEPLOY_PATH }}/
          overwrite: true

      - name: Deploy + restart PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          script: |
            set -e
            DEPLOY="${{ env.DEPLOY_PATH }}"
            PM2_NAME="${{ env.PM2_NAME }}"
            TARBALL="${DEPLOY}/vansrouter-deploy.tar.gz"

            echo "=== Extracting build to ${DEPLOY}/.next/standalone ==="
            if [ ! -f "${TARBALL}" ]; then
              echo "ERROR: deployment tarball missing at ${TARBALL}" >&2
              exit 2
            fi
            mkdir -p "${DEPLOY}/.next/standalone"
            # Backup current standalone
            if [ -d "${DEPLOY}/.next/standalone_old" ]; then
              rm -rf "${DEPLOY}/.next/standalone_old"
            fi
            if [ -d "${DEPLOY}/.next/standalone" ]; then
              mv "${DEPLOY}/.next/standalone" "${DEPLOY}/.next/standalone_old"
            fi
            mkdir -p "${DEPLOY}/.next/standalone"
            tar -xzf "${TARBALL}" -C "${DEPLOY}/.next/standalone"
            rm -f "${TARBALL}"

            # --- INTEGRITY GATE (incident 2026-09-11) --------------------------
            # A corrupt route chunk (4903.js, "Missing catch or finally after
            # try") once went live and 500'd EVERY /v1/chat/completions request
            # while /masuk stayed HTTP 200, so the health check passed a dead
            # router. Syntax-check the extracted server bundle BEFORE restarting
            # PM2. Fail-open only if node itself is missing; a corrupt bundle
            # restores the previous build and aborts (same guarantee as the
            # health-check rollback below). NEVER hand-edit files under
            # .next/standalone on the VPS — that is how the corrupt chunk got
            # in (single-file mtime, no CI run).
            echo "=== Integrity gate: syntax-check extracted server bundle ==="
            if command -v node >/dev/null 2>&1; then
              GATE_FAIL=0
              for f in "${DEPLOY}/.next/standalone/.next/server/chunks/"*.js "${DEPLOY}/.next/standalone/.next/server/"*.js; do
                [ -e "$f" ] || continue
                node --check "$f" >/dev/null 2>&1 || { echo "CORRUPT BUNDLE FILE: $f" >&2; GATE_FAIL=1; }
              done
              if [ "$GATE_FAIL" != "0" ]; then
                echo "ERROR: fresh bundle failed integrity gate — restoring standalone_old, aborting" >&2
                if [ -d "${DEPLOY}/.next/standalone_old" ]; then
                  rm -rf "${DEPLOY}/.next/standalone"
                  mv "${DEPLOY}/.next/standalone_old" "${DEPLOY}/.next/standalone"
                  pm2 restart "${PM2_NAME}" --update-env 2>/dev/null || true
                  echo "=== previous build restored, deploy aborted ==="
                else
                  echo "❌ No standalone_old backup — MANUAL INTERVENTION NEEDED" >&2
                fi
                exit 1
              fi
              echo "✅ Bundle integrity gate passed"
            else
              echo "⚠️ node not on PATH — skipping bundle integrity gate (fail-open)"
            fi

            # Place the bundled launcher (with .env auto-loader) at the deploy
            # root, replacing the old server.js that did NOT load .env. Without
            # this, INITIAL_PASSWORD/JWT_SECRET from .env are never picked up.
            if [ -f "${DEPLOY}/.next/standalone/launcher.js" ]; then
              cp "${DEPLOY}/.next/standalone/launcher.js" "${DEPLOY}/server.js"
              echo "=== launcher.js -> ${DEPLOY}/server.js (env loader shipped) ==="
            fi

            # Preserve .env (it lives at project root, not in standalone)
            echo "=== .env exists? ==="
            ls -la "${DEPLOY}/.env" 2>/dev/null || echo "WARNING: .env not found"

            # --- OPEN-SSE RUNTIME ------------------------------------------
            # The router resolves "open-sse/..." as a bare specifier from the
            # deploy root (legacy layout: PM2 exec cwd=/home/ubuntu, module
            # search walks up to ${DEPLOY}/open-sse). The standalone tarball
            # carries open-sse/ too (build step copies it), but the legacy
            # root copy must be refreshed as well or old files (0.9.80-era,
            # no FreeBuff / no rtk/promptInjectors.js) keep being used.
            if [ -d "${DEPLOY}/.next/standalone/open-sse" ]; then
              rm -rf "${DEPLOY}/open-sse"
              cp -r "${DEPLOY}/.next/standalone/open-sse" "${DEPLOY}/open-sse"
              # Mirror the standalone node_modules copies so bare-specifier
              # resolution also works when the process cwd is the deploy root
              # (PM2 exec cwd=/home/ubuntu walks up to ${DEPLOY}).
              rm -rf "${DEPLOY}/node_modules/open-sse" "${DEPLOY}/node_modules/@"
              mkdir -p "${DEPLOY}/node_modules/@"
              cp -r "${DEPLOY}/open-sse" "${DEPLOY}/node_modules/open-sse"
              # @/* = ./src/* (jsconfig) — mirror the whole src tree.
              cp -r "${DEPLOY}/.next/standalone/src/." "${DEPLOY}/node_modules/@/"
              cp -r "${DEPLOY}/.next/standalone/src" "${DEPLOY}/node_modules/src"
              cp "${DEPLOY}/package.json" "${DEPLOY}/node_modules/package.json"
              echo "=== open-sse refreshed from standalone (FreeBuff + rtk/promptInjectors included) ==="
            fi

            # --- DATA SAFETY -------------------------------------------------
            # The SQLite DB (custom providers, settings, keys, usage) lives in
            # $DATA_DIR (default ~/.9router, or DATA_DIR from .env), which is
            # OUTSIDE .next/standalone and therefore untouched by the tarball
            # extraction above. Take an explicit pre-deploy backup anyway so a
            # bad restart never loses data. Never rm -rf the data dir.
            DATA_DIR_VAL="$(grep -E '^DATA_DIR=' "${DEPLOY}/.env" 2>/dev/null | tail -1 | cut -d= -f2- | sed -E 's/^["'\''"]|["'\''"]$//g')"
            DATA_DIR_VAL="${DATA_DIR_VAL:-$HOME/.9router}"
            if [ -d "${DATA_DIR_VAL}" ]; then
              BACKUP_DIR="/home/ubuntu/vansrouter-data-backup-$(date +%Y%m%d-%H%M%S)"
              mkdir -p "${BACKUP_DIR}"
              cp -a "${DATA_DIR_VAL}/." "${BACKUP_DIR}/" 2>/dev/null \
                && echo "=== DB backed up: ${BACKUP_DIR} ===" \
                || echo "WARNING: DB backup failed (continuing)"
              # Keep only the 3 most recent backups
              ls -dt /home/ubuntu/vansrouter-data-backup-* 2>/dev/null | tail -n +4 | xargs -r rm -rf
            else
              echo "=== No DB dir at ${DATA_DIR_VAL} yet (first run) ==="
            fi

            echo "=== Restarting PM2 process: ${PM2_NAME} ==="
            export PORT="${PORT:-20128}"
            pm2 restart "${PM2_NAME}" --update-env 2>/dev/null || pm2 start "${DEPLOY}/server.js" --name "${PM2_NAME}" --env production
            pm2 save --force || echo "[warn] pm2 save failed (dump permission) — non-fatal"

            echo "=== Health check (PORT=${PORT}) ==="
            sleep 3
            for i in 1 2 3 4 5 6 7 8; do
              if curl -fsS "http://localhost:${PORT}/masuk" > /dev/null 2>&1; then
                echo "✅ VansRouter running on :${PORT}"
                break
              fi
              echo "Attempt $i: not ready yet..."
              sleep 3
            done

            # Final verify — follow redirects (app may 307 / → /masuk) and
            # accept 200/307 as healthy (the page itself redirects when the
            # dashboard is enabled; a hard failure is 4xx/5xx/000).
            STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" "http://localhost:${PORT}/masuk")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Deploy successful (HTTP $STATUS)"

              # --- ENGINE GATE -------------------------------------------------
              # The engine (godmode framing, bypass engine, compaction reassert,
              # potato mechanics, instruction plan, response integrity) is NOT
              # in the repo and is NOT built here. It is compiled in GitHub
              # Actions from the private source repo and arrives inside this
              # tarball at <standalone>/data/engine/engine.cjs. A missing or
              # corrupt bundle degrades the router to a plain proxy — working,
              # but NOT the product. Verify it actually LOADED instead of
              # trusting that the file unpacked.
              #
              # A stale hand-placed copy at the deploy root would shadow the
              # artifact (engineLoader prefers the standalone path, but leaving
              # the old file around invites the next manual build). Remove it.
              if [ -f "${DEPLOY}/data/engine/engine.cjs" ]; then
                echo "=== Removing stale hand-placed engine bundle at deploy root (superseded by the CI artifact) ==="
                rm -f "${DEPLOY}/data/engine/engine.cjs"
                rmdir "${DEPLOY}/data/engine" 2>/dev/null || true
              fi

              echo "=== Engine gate: private bundle must be reachable from the runtime ==="
              if [ ! -f "${DEPLOY}/.next/standalone/data/engine/engine.cjs" ]; then
                echo "❌ ENGINE MISSING: ${DEPLOY}/.next/standalone/data/engine/engine.cjs not found" >&2
                echo "   Router is running in degraded (plain proxy) mode — no godmode/bypass/persona layer." >&2
                echo "   The tarball did not carry it. Re-run the build workflow; do NOT build on this host." >&2
                exit 3
              fi

              # Presence is not reachability. The loader anchors on the live cwd
              # and on the shim's own location, which differ between a developer
              # shell and the standalone server (Next.js chdirs into
              # .next/standalone, and import.meta.url of a bundled module is
              # frozen at build time). Probe the real resolution path.
              # The probe lives in open-sse/rtk/ because open-sse is copied into
              # the standalone artifact on every build; scripts/ is not reliable
              # there.
              ENGINE_PROBE="$(cd "${DEPLOY}/.next/standalone" && node open-sse/rtk/engineProbe.mjs 2>&1 | tail -1)"
              case "${ENGINE_PROBE}" in
                LOADED:*)
                  echo "✅ Engine gate passed — ${ENGINE_PROBE}"
                  ;;
                *)
                  echo "❌ ENGINE GATE FAILED — router is running WITHOUT the engine (degraded plain proxy)." >&2
                  echo "   probe output: ${ENGINE_PROBE}" >&2
                  echo "   The router answers requests but is not the product. Failing the deploy." >&2
                  exit 3
                  ;;
              esac

              # Belt and braces: if any request already ran, the shim logs a boot
              # line. Absent log is not fatal on its own (the shim loads lazily
              # on first use), so this is informational only.
              if pm2 logs "${PM2_NAME}" --lines 400 --nostream 2>/dev/null | grep -q "\[ENGINE\] loaded"; then
                echo "ℹ️  '[ENGINE] loaded' seen in recent logs"
              else
                echo "ℹ️  No '[ENGINE] loaded' line yet — expected, the shim loads on first chat request"
              fi
              # Verify the configured password actually authenticates (not just
              # the page rendering). Read INITIAL_PASSWORD from the VPS .env
              # (the same source the launcher loads), not the CI runner env.
              # Note: from schema v4 the effective password may live in the
              # SQLite DB (set via dashboard) rather than INITIAL_PASSWORD.
              # If INITIAL_PASSWORD is absent/unset, skip the auth probe —
              # the health check (HTTP 200 on /masuk) already proves the
              # server is serving; a DB-backed password is out of CI's scope.
              DEPLOY_PW="$(grep -E '^INITIAL_PASSWORD=' "${DEPLOY}/.env" 2>/dev/null | tail -1 | cut -d= -f2- | xargs echo)"
              DEPLOY_PW="${DEPLOY_PW:-}"
              if [ -n "$DEPLOY_PW" ]; then
                LOGIN_BODY=$(curl -s --max-time 10 -X POST "http://localhost:${PORT}/api/auth/login" \
                  -H "Content-Type: application/json" \
                  -d "{\"password\":\"${DEPLOY_PW}\"}")
                if echo "$LOGIN_BODY" | grep -q '"success":true'; then
                  echo "✅ Auth check passed (configured password accepted)"
                else
                  echo "⚠️ Auth probe failed (expected if password was changed in the dashboard / DB — health check already passed): $LOGIN_BODY"
                fi
              else
                echo "ℹ️ INITIAL_PASSWORD unset in .env — skipping auth probe (DB-backed password out of CI scope)"
              fi
              rm -f "${TARBALL}"
            else
              echo "❌ Health check failed (HTTP $STATUS)"
              echo "=== Auto-rollback: restoring standalone_old ==="
              if [ -d "${DEPLOY}/.next/standalone_old" ]; then
                rm -rf "${DEPLOY}/.next/standalone"
                mv "${DEPLOY}/.next/standalone_old" "${DEPLOY}/.next/standalone"
                # Restore open-sse from old build too
                if [ -d "${DEPLOY}/.next/standalone/open-sse" ]; then
                  rm -rf "${DEPLOY}/open-sse"
                  cp -r "${DEPLOY}/.next/standalone/open-sse" "${DEPLOY}/open-sse"
                  rm -rf "${DEPLOY}/node_modules/open-sse" "${DEPLOY}/node_modules/@"
                  mkdir -p "${DEPLOY}/node_modules/@"
                  cp -r "${DEPLOY}/open-sse" "${DEPLOY}/node_modules/open-sse"
                  cp -r "${DEPLOY}/.next/standalone/src/." "${DEPLOY}/node_modules/@/"
                  cp -r "${DEPLOY}/.next/standalone/src" "${DEPLOY}/node_modules/src"
                  cp "${DEPLOY}/package.json" "${DEPLOY}/node_modules/package.json"
                  echo "=== open-sse rolled back from old build ==="
                fi
                if [ -f "${DEPLOY}/.next/standalone/launcher.js" ]; then
                  cp "${DEPLOY}/.next/standalone/launcher.js" "${DEPLOY}/server.js"
                fi
                pm2 restart "${PM2_NAME}" --update-env 2>/dev/null || true
                sleep 3
                ROLLBACK_STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" "http://localhost:${PORT}/masuk")
                if [ "$ROLLBACK_STATUS" = "200" ]; then
                  echo "✅ Rollback successful (HTTP $ROLLBACK_STATUS) — previous version restored"
                else
                  echo "❌ Rollback also failed (HTTP $ROLLBACK_STATUS) — MANUAL INTERVENTION NEEDED"
                fi
              else
                echo "❌ No standalone_old backup — cannot auto-rollback, MANUAL INTERVENTION NEEDED"
              fi
              echo "=== pm2 describe ==="
              pm2 describe "${PM2_NAME}" 2>&1 | head -30
              echo "=== pm2 error log (last 40) ==="
              pm2 logs "${PM2_NAME}" --lines 40 --nostream --err 2>&1
              exit 1
            fi
