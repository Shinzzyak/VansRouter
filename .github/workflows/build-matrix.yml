name: Cross-platform build matrix

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node:
          - 22
          - 24

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
        # Note: setup-node's pnpm cache requires a workspace "packages" field,
        # which this repo does not use. pnpm/action-setup handles installation.

      - name: Configure pnpm hoisting config
        shell: bash
        run: |
          echo "public-hoist-pattern=*" >> .npmrc
          echo "shamefully-hoist=true" >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run no-undef lint (catch undefined before build)
        run: pnpm lint:undef

      # These two suites lock behaviour that silently rotted: the golden snapshot
      # recorded pre-change headers for six providers, and a stale vi.mock took
      # out ten ACL tests. Neither ran anywhere, so both drifted unnoticed for
      # days. They are pure (no engine bundle needed) and cheap, so they run on
      # every pull request. Add a suite here only once it passes without the
      # engine bundle.
      #
      # The settings write-path trio joins them for the same reason: pure (temp
      # DATA_DIR + real SQLite, no engine bundle), and it locks the write
      # contract for the nested settings maps. A regression there is invisible —
      # it silently eats adapter pools instead of erroring.
      #
      # The capabilities pair guards the OTHER silent class: a model that loses
      # fields without erroring. capabilities.test.js pins families whose only
      # source is MODEL_CAPABILITIES (a merge once dropped four of them);
      # capabilities-refine-exact.test.js pins the catalog install and the
      # refine() step on exact entries.
      #
      # Two more join them, both pure and both for a silent class:
      # capabilities-alias-map.test.js recomputes the alias→id table from the
      # registry, because a wrong key changes a model's context window with no
      # error; balance-exhausted-verdict.test.js pins that the prepaid-relay
      # verdict fires on an empty wallet and NOT on the nine error classes that
      # must keep their own handling — a false positive deactivates a healthy
      # account until a human notices.
      - name: Regression guards (golden URL/headers, handler ACL, settings write path, capabilities, balance verdict)
        run: >-
          pnpm test
          tests/translator/golden-url-header.test.js
          tests/unit/handler-acl-enforcement.test.js
          tests/unit/settings-nested-merge.test.js
          tests/unit/settings-map-write-contract.test.js
          tests/unit/settings-route-write-e2e.test.js
          tests/unit/capabilities.test.js
          tests/unit/capabilities-refine-exact.test.js
          tests/unit/capabilities-alias-map.test.js
          tests/unit/balance-exhausted-verdict.test.js

      - name: Build application
        run: node scripts/build.js

      - name: Verify standalone output exists
        shell: bash
        run: |
          test -d .next/standalone
          test -f .next/standalone/server.js
