packages:
  - "."

allowBuilds:
  better-sqlite3: true
  esbuild: set this to true or false
  sharp: true
  unrs-resolver: true

# Supply-chain hardening (see react-doctor require-pnpm-hardening):
# minimumReleaseAge delays installs of freshly-published versions (minutes; 10080 = 7 days)
# so malware caught & unpublished within hours never gets installed.
# trustPolicy: no-downgrade rejects packages whose provenance/signature weakens between updates.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - next
  - "@next/*"
  - dompurify

onlyBuiltDependencies:
  - better-sqlite3
  - sharp
  - unrs-resolver
  - inotify
  - esbuild

dangerouslyAllowAllBuilds: true

pnpm:
  requiredScripts:
    - build

# browserslist <=4.28.6 carries an advisory and only arrives transitively
# (next -> styled-jsx -> @babel/core), so an override is the only lever.
# Duplicated on purpose: the deploy workflow pins pnpm 11 (reads this file),
# the build matrix pins pnpm 9 (reads package.json `pnpm.overrides`). Same value
# in both keeps --frozen-lockfile happy on either version.
overrides:
  browserslist: ">=4.28.7"
trustPolicy: no-downgrade
trustPolicyExclude:
  - react-redux
  - reselect
  - semver
  - eslint-import-resolver-typescript
  - nanoid
